name: mobile-ios

# iOS shell for the gateway.
#
# iOS has no system Python, so the interpreter is linked into the app: the
# XCFramework comes from BeeWare's python-app-support release and ships as
# Python.framework inside the bundle. The standard library is laid out by
# scripts/sync-core.sh under Resources/python/lib/python3.x (PYTHONHOME) and the
# app code under Resources/app (PYTHONPATH), per CPython's iOS guide.
#
# The produced IPA is intentionally *unsigned*: signing needs the maintainer's
# team ID and certificate, which must not live in this repository. Sideload
# tools (AltStore/Sideloadly) or a local Xcode build with a team can sign it.
on:
  push:
    branches: [main]
    # 发版 tag 要重新出包：Release 里放的必须是「这一版核心打进 IPA」的产物。
    # tag 推送不参与 paths 过滤，所以即使这个 tag 只动了文档，也会照常构建。
    tags: ["v*"]
    paths:
      - "wb_*.py"
      - "dashboard.html"
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"
  pull_request:
    paths:
      - "wb_*.py"
      - "dashboard.html"
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Pinned support package: bump both values together when moving Python.
  PYTHON_SUPPORT_TAG: "3.13-b18"
  PYTHON_SUPPORT_ASSET: "Python-3.13-iOS-support.b18.tar.gz"

jobs:
  build:
    # 工程按 xcode15_3 格式生成（见 mobile/ios/project.yml），Xcode 15 就能读；
    # macos-14 的 arm64 机器比 macos-15 更容易排到（macos-15 长期报
    # "The job was not acquired by Runner of type hosted"）。
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve version from source
        id: version
        run: |
          VERSION=$(grep -oE 'server_version = "wb-proxy/[0-9.]+"' wb_proxy.py \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "value=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Syntax gate (gateway core + bridge)
        run: |
          python3 -m compileall -q wb_proxy.py wb_accounts.py wb_settings.py \
            mobile/shared mobile/ios/WorkBuddyHub/PythonBridge

      # ~200MB download; cache it so repeat builds skip GitHub Releases.
      - name: Fetch embedded CPython
        uses: actions/cache@v4
        id: support-cache
        with:
          path: mobile/ios/Vendor
          key: python-ios-support-${{ env.PYTHON_SUPPORT_TAG }}

      - name: Download python-app-support
        if: steps.support-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p mobile/ios/Vendor
          URL="https://github.com/beeware/Python-Apple-support/releases/download/${PYTHON_SUPPORT_TAG}/${PYTHON_SUPPORT_ASSET}"
          curl -sSL -o /tmp/support.tar.gz "$URL"
          tar -xzf /tmp/support.tar.gz -C mobile/ios/Vendor
          test -d mobile/ios/Vendor/Python.xcframework

      - name: Sync gateway core
        run: |
          chmod +x mobile/ios/scripts/sync-core.sh
          mobile/ios/scripts/sync-core.sh
          ls mobile/ios/WorkBuddyHub/Resources/app | head -5
          # 标准库必须落在 python/lib/pythonX.Y 这一层，否则运行时 import 全失败。
          ls -d mobile/ios/WorkBuddyHub/Resources/python/lib/python3.*

      # iOS 上 OpenSSL 没有系统 CA 路径，上游 HTTPS 必须靠随包的证书束。
      - name: Install CA bundle
        run: |
          set -euo pipefail
          DEST=mobile/ios/WorkBuddyHub/Resources/app
          python3 -m pip install --quiet --disable-pip-version-check --target "$DEST" certifi
          test -f "$DEST/certifi/cacert.pem"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
          ls -d WorkBuddyHub.xcodeproj

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          cd mobile/ios
          xcodebuild \
            -project WorkBuddyHub.xcodeproj \
            -scheme WorkBuddyHub \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          APP="mobile/ios/build/Build/Products/Release-iphoneos/WorkBuddyHub.app"
          # 三件套缺一不可：桥接代码/面板在 app/，标准库在 python/lib/，
          # 解释器本体在 Frameworks/。少任何一个都是启动即崩。
          test -f "$APP/app/wb_proxy.py"
          test -f "$APP/app/wb_hub_ios.py"
          test -f "$APP/app/dashboard.html"
          test -f "$APP/app/certifi/cacert.pem"
          ls -d "$APP"/python/lib/python3.*/os.py >/dev/null
          ls -d "$APP"/python/lib/python3.*/encodings/__init__.py >/dev/null
          test -d "$APP/Frameworks/Python.framework"
          du -sh "$APP"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd mobile/ios
          APP="build/Build/Products/Release-iphoneos/WorkBuddyHub.app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry "../../WorkBuddyHub-${{ steps.version.outputs.value }}-unsigned.ipa" Payload
          ls -lh "../../WorkBuddyHub-${{ steps.version.outputs.value }}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-hub-ios
          path: mobile/ios/*.ipa
          if-no-files-found: error

      # 同 Android：release.yml 独占 draft 的创建权，这里只等它建好再追加。
      # 未签名是刻意的（签名要维护者的 Team 与证书），所以文件名里写明。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-mobile
          cp mobile/ios/*.ipa "dist-mobile/workbuddy-hub-ios-${TAG}-unsigned.ipa"
          for _ in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist-mobile/*.ipa --clobber
              echo "attached $(ls dist-mobile/*.ipa) to $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::30 分钟内没等到 $TAG 的 draft release，跳过附加（IPA 仍在本次运行的 artifact 里）"
