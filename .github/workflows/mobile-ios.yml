name: mobile-ios

# iOS container build.
#
# iOS has no system Python, so the interpreter is linked into the app: the
# XCFramework comes from BeeWare's python-app-support release and ships as
# Python.framework inside the bundle. The standard library is laid out by
# scripts/sync-core.sh under Resources/python/lib/python3.x (PYTHONHOME) and the
# app code under Resources/app (PYTHONPATH), per CPython's iOS guide. The
# gateway core in Resources/app is fetched from an external project ZIP by
# sync-core.sh - this repository ships no gateway source of its own.
#
# scripts/install-python.sh then runs as a post-build step and converts the 68
# binary extension modules in lib-dynload (_hashlib, _sha1, _socket, _ssl, ...)
# into Frameworks/<name>.framework, leaving .fwork pointers behind. iOS refuses
# to dlopen a bare .so: without this step the app dies on launch with
# "AttributeError: module 'hashlib' has no attribute 'sha1'".
#
# The produced IPA is intentionally *unsigned*: signing needs the maintainer's
# team ID and certificate, which must not live in this repository. Sideload
# tools (AltStore/Sideloadly) or a local Xcode build with a team can sign it.
on:
  # 手动触发入口：代理不通、或想用当前 main 立刻重出一份包时用得上。
  workflow_dispatch:
  push:
    branches: [main]
    # 发版 tag 要重新出包，不能复用 main 上一次构建留下的产物。
    # tag 推送不参与 paths 过滤，所以即使这个 tag 只动了文档，也会照常构建。
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Pinned support package: bump both values together when moving Python.
  PYTHON_SUPPORT_TAG: "3.13-b18"
  PYTHON_SUPPORT_ASSET: "Python-3.13-iOS-support.b18.tar.gz"

jobs:
  build:
    # iOS 26 的持续后台任务（BGContinuedProcessingTask）与新版 ActivityKit 必须用
    # iOS 26 SDK 才能编译，因此镜像要能提供 Xcode 26；macos-14 已停止支持。
    # 镜像默认 Xcode 仍是 16.x，下面显式切到 26。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "${XCODE}" ]; then
            echo "::error::runner 上没有 Xcode 26，iOS 26 API 无法编译"
            exit 1
          fi
          sudo xcode-select -s "${XCODE}"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve version from source
        id: version
        run: |
          # 容器版本只跟 mobile/VERSION 走，与导入的网关版本无关。
          VERSION=$(tr -d '[:space:]' < mobile/VERSION)
          VERSION=${VERSION:-0.0.0}
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          # CFBundleVersion 取 主*10000 + 次*100 + 修，与 Android 的 versionCode 同源：
          # 1.10.9 -> 11009。恒为 1 的话，覆盖安装时系统分不出新旧版本。
          BUILD=$(echo "$VERSION" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')
          echo "build=${BUILD:-1}" >> "$GITHUB_OUTPUT"

      - name: Syntax gate (container bridge)
        run: |
          python3 -m compileall -q \
            mobile/shared mobile/ios/OneGateway/PythonBridge
          # 双形态兼容契约：iOS 的 GatewayProfile 与 Android/Python 端必须对齐。
          python3 tests/_test_gateway_container.py

      # ~200MB download; cache it so repeat builds skip GitHub Releases.
      - name: Fetch embedded CPython
        uses: actions/cache@v4
        id: support-cache
        with:
          path: mobile/ios/Vendor
          key: python-ios-support-${{ env.PYTHON_SUPPORT_TAG }}

      - name: Download python-app-support
        if: steps.support-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p mobile/ios/Vendor
          URL="https://github.com/beeware/Python-Apple-support/releases/download/${PYTHON_SUPPORT_TAG}/${PYTHON_SUPPORT_ASSET}"
          curl -sSL -o /tmp/support.tar.gz "$URL"
          tar -xzf /tmp/support.tar.gz -C mobile/ios/Vendor
          test -d mobile/ios/Vendor/Python.xcframework

      - name: Fetch external gateway core
        run: |
          chmod +x mobile/ios/scripts/sync-core.sh mobile/ios/scripts/install-python.sh
          mobile/ios/scripts/sync-core.sh
          ls mobile/ios/OneGateway/Resources/app | head -5
          # 标准库必须落在 python/lib/pythonX.Y 这一层，否则运行时 import 全失败。
          ls -d mobile/ios/OneGateway/Resources/python/lib/python3.*
          # 二进制扩展也必须在（_sha1/_hashlib/_socket/_ssl），它们只在设备切片的
          # lib-arm64 下，漏了就是「hashlib has no attribute sha1」。
          ls mobile/ios/OneGateway/Resources/python/lib/python3.*/lib-dynload/_sha1*.so

      # iOS 上 OpenSSL 没有系统 CA 路径，上游 HTTPS 必须靠随包的证书束。
      - name: Install CA bundle
        run: |
          set -euo pipefail
          DEST=mobile/ios/OneGateway/Resources/app
          python3 -m pip install --quiet --disable-pip-version-check --target "$DEST" certifi
          test -f "$DEST/certifi/cacert.pem"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
          ls -d OneGateway.xcodeproj

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          cd mobile/ios
          xcodebuild \
            -project OneGateway.xcodeproj \
            -scheme OneGateway \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          APP="mobile/ios/build/Build/Products/Release-iphoneos/OneGateway.app"
          # 三件套缺一不可：桥接代码/面板在 app/，标准库在 python/lib/，
          # 解释器本体在 Frameworks/。少任何一个都是启动即崩。
          test -f "$APP/app/wb_proxy.py"
          test -f "$APP/app/wb_hub_ios.py"
          test -f "$APP/app/dashboard.html"
          test -f "$APP/app/certifi/cacert.pem"
          ls -d "$APP"/python/lib/python3.*/os.py >/dev/null
          ls -d "$APP"/python/lib/python3.*/encodings/__init__.py >/dev/null
          test -d "$APP/Frameworks/Python.framework"
          # 二进制扩展必须已经转成 framework 并留下 .fwork 指针：这是 iOS 上
          # 唯一能被 dlopen 的形态。缺了它，App 启动即报
          #   AttributeError: module 'hashlib' has no attribute 'sha1'
          # 接着 _socket / _ssl 也全废，网关根本监听不了端口。
          ls "$APP"/python/lib/python3.*/lib-dynload/_sha1*.fwork >/dev/null
          test -d "$APP/Frameworks/_sha1.framework"
          test -d "$APP/Frameworks/_hashlib.framework"
          test -d "$APP/Frameworks/_socket.framework"
          test -d "$APP/Frameworks/_ssl.framework"
          # 反向校验：Frameworks 之外不许残留可执行的 .so（App Store 会拒）。
          stray=$(find "$APP" -name '*.so' -not -path "*/Frameworks/*" | head -n 1)
          if [ -n "$stray" ]; then
            echo "::error::Frameworks 之外仍有 .so 二进制：$stray"
            exit 1
          fi
          # 实时活动：appex 必须在 PlugIns/ 里，且主包 Info.plist 声明了 Live Activity
          # 与持续后台任务的 identifier（缺任一项，锁屏/灵动岛或后台保活就是静默失效）。
          test -d "$APP/PlugIns/OneGatewayWidget.appex"
          test -f "$APP/PlugIns/OneGatewayWidget.appex/OneGatewayWidget"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers:0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" \
            "$APP/PlugIns/OneGatewayWidget.appex/Info.plist"
          # 容器里没有任何 Go 产物：主二进制不该链入网关静态库，包内也不该有残留。
          if find "$APP" \( -name 'libgateway.a' -o -name 'libgateway.h' \) | grep -q .; then
            echo "::error::Go 静态库被当成资源打进了 App 包"
            exit 1
          fi
          du -sh "$APP"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd mobile/ios
          APP="build/Build/Products/Release-iphoneos/OneGateway.app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry "../../OneGateway-${{ steps.version.outputs.value }}-unsigned.ipa" Payload
          ls -lh "../../OneGateway-${{ steps.version.outputs.value }}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: one-gateway-ios
          path: mobile/ios/*.ipa
          if-no-files-found: error

      # 同 Android：release.yml 独占 draft 的创建权，这里只等它建好再追加。
      # 未签名是刻意的（签名要维护者的 Team 与证书），所以文件名里写明。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-mobile
          cp mobile/ios/*.ipa "dist-mobile/one-gateway-ios-${TAG}-unsigned.ipa"
          for _ in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist-mobile/*.ipa --clobber
              echo "attached $(ls dist-mobile/*.ipa) to $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::30 分钟内没等到 $TAG 的 draft release，跳过附加（IPA 仍在本次运行的 artifact 里）"
