name: mobile-android

# Android container build.
#
# This repository holds only the shell: Chaquopy's CPython plus a thin runtime
# that imports an external gateway ZIP on first launch. No gateway source is
# packaged into the APK (a step below asserts that), so an upstream gateway
# change never needs an APK rebuild - only shell changes do.
on:
  # 手动触发入口：代理不通、或想用当前 main 立刻重出一份包时用得上。
  workflow_dispatch:
  push:
    branches: [main]
    # 发版 tag 要重新出包，不能复用 main 上一次构建留下的 artifact。
    # tag 推送不参与 paths 过滤，即使只动了文档也会照常构建。
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 两个 ABI flavor × debug/release = 4 个变体，比单包时多出一倍打包次数，
    # 45 分钟不够稳，放宽到 60。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # AGP 9.4 needs JDK 17, SDK Build Tools 36 and Gradle 9.6; Chaquopy needs a
      # host Python whose minor version matches the embedded one (3.13).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Syntax gate (container bridge)
        run: |
          python -m compileall -q \
            mobile/shared mobile/android/app/src/main/python
          # compileall 会在被编译的源码旁边留 __pycache__。这个目录稍后会被
          # Chaquopy 整个打进 assets/chaquopy/app.imy，所以编译完必须清掉——
          # 否则 APK 里会多出一份构建脏东西（测试套件也可能顺手写一份）。
          rm -rf mobile/android/app/src/main/python/__pycache__
          # 「自动导入最新版」的接线与解压契约：按钮还在、下载地址首选镜像、
          # ZIP 结构与解压逻辑对得上。纯离线、亚秒级，编译前先把这类低级错误拦掉。
          python tests/_test_android_auto_import.py

      # 固定 debug 签名。
      # AGP 在没有 debug.keystore 时会**现场生成**一对随机密钥：alias
      # （androiddebugkey）和口令（android）都是固定值，密钥本身不是。托管 runner
      # 每次都是全新虚拟机，于是每次构建的证书都不同——跨构建无法覆盖安装
      # （INSTALL_FAILED_UPDATE_INCOMPATIBLE），依赖签名指纹的校验也会失效。
      # 把一份固定 keystore 存进 secret，构建前还原，签名就稳定了。
      # secret 里放的是 **base64 文本**，不是 keystore 二进制：Secret 的值必须是
      # 合法 UTF-8，直接塞二进制会让整个工作流在 startup 阶段失败，报
      # "The secret ... is not properly UTF-8 encoded"，连 job 都不会创建。
      - name: Restore fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.WB_ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::未配置 WB_ANDROID_DEBUG_KEYSTORE：本次签名由 AGP 随机生成，无法覆盖安装其它构建"
            exit 0
          fi
          KS="$RUNNER_TEMP/wb-debug.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          # 口令必须是 AGP 约定的 android，否则要等签名阶段才报错，很难定位。
          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey >/dev/null
          echo "debug keystore 已还原：$KS"
          keytool -list -v -keystore "$KS" \
            -storepass android -alias androiddebugkey | grep -E "SHA256:" || true
          # 显式告诉 Gradle 用哪份 keystore。不要指望 ~/.android/debug.keystore：
          # runner 的 ANDROID_SDK_HOME / ANDROID_USER_HOME 与 $HOME 不一致时，
          # AGP 会忽略它并自己生成一对随机密钥（实测踩过）。
          echo "WB_ANDROID_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"

      # 每个 ABI 一个 flavor（arm64 / x64），所以 assembleDebug/assembleRelease 会各出两个包。
      # 产物路径因此多了一层 flavor 目录：apk/<flavor>/<buildType>/app-<flavor>-<buildType>.apk
      - name: Build APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Report artifacts
        run: |
          set -euo pipefail
          shopt -s globstar
          ls -lh mobile/android/app/build/outputs/apk/**/*.apk
          # 容器模式：APK 里只应有 Python 运行时与薄桥接层，**不应**再有网关源码。
          # 一旦 assets/core 又冒出来，说明构建脚本还在把核心打进包——那会让
          # 「导入 ZIP 升级网关」的版本判断失效（包内旧核心与导入的新项目打架）。
          # 同时校验拆包真的生效：一个包只能带一个 ABI 的原生库、一份 ABI 专属标准库。
          for apk in mobile/android/app/build/outputs/apk/*/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            listing=$(unzip -l "$apk")
            printf '%s\n' "$listing" | grep -q "assets/chaquopy/" \
              || { echo "::error::$apk 里没有 Chaquopy 运行时，Python 环境没打进去"; exit 1; }
            # 不止 wb_proxy.py：整个 assets/core/、任何 .py/.pyc、以及面板 HTML
            # 都不该出现——APK 只是容器，网关必须完全来自用户导入的 ZIP。
            if printf '%s\n' "$listing" \
                | awk '$4 ~ /^assets\/core\// || $4 ~ /\.pyc?$/ || $4 ~ /(^|\/)dashboard\.html$/ {print; hit=1} END {exit !hit}'; then
              echo "::error::$apk 里出现了网关文件（assets/core 或 .py/.pyc/dashboard.html）"
              exit 1
            fi
            # 网关是纯标准库实现；带出任何 pip 依赖都说明有东西被搬进了 APK。
            deps=$(unzip -p "$apk" assets/chaquopy/requirements-common.imy 2>/dev/null | tr -d '\000' | wc -c)
            echo "   依赖清单字节数: $deps（空包约 22 B，只是 ZIP 尾）"
            [ "$deps" -lt 200 ] || { echo "::error::$apk 带了 pip 依赖，容器不该有第三方包"; exit 1; }

            abis=$(printf '%s\n' "$listing" \
              | awk '$4 ~ /^lib\// {split($4, p, "/"); print p[2]}' | sort -u)
            echo "   原生库 ABI: $(echo "$abis" | tr '\n' ' ')"
            [ "$(printf '%s\n' "$abis" | wc -l)" -eq 1 ] \
              || { echo "::error::$apk 带了多个 ABI 的原生库，拆包没生效"; exit 1; }

            stdlib=$(printf '%s\n' "$listing" | awk '
              $4 ~ /^assets\/chaquopy\/stdlib-/ && $4 !~ /stdlib-common/ {n++} END {print n + 0}')
            echo "   ABI 专属标准库份数: $stdlib"
            [ "$stdlib" -eq 1 ] \
              || { echo "::error::$apk 带了 $stdlib 份 ABI 标准库，拆包没生效"; exit 1; }
          done

      # 把实际签进 APK 的证书打出来：签名是否固定，日志里一眼可查，不用下载对比。
      - name: Report signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner \
            | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::找不到 apksigner，跳过证书指纹打印"
            exit 0
          fi
          for apk in mobile/android/app/build/outputs/apk/*/*/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" \
              | grep "certificate SHA-256 digest" | head -n1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-gateway-runtime-android
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Release 的创建权在 release.yml：它只建 draft，由维护者补完说明后手动
      # Publish。这里绝不能自己建 release——softprops/action-gh-release 在没有
      # 现存 release 时会建成**已发布**状态，既绕开约定，也会让 release.yml
      # 检测到「不是 draft」而中止整条发布。
      # 所以：等 draft 出现，再往里追加产物。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 便携版打出来的 OpenWrt 包也以 .apk 结尾，重命名避免同名的混淆。
          # 每个 ABI 一个 flavor，文件名带上 flavor，下载时不用猜是给真机还是模拟器：
          #   ...-arm64.apk  真机（几乎全部 Android 手机）
          #   ...-x64.apk    模拟器 / x86_64 设备
          mkdir -p dist-mobile
          for apk in mobile/android/app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist-mobile/proxy-gateway-runtime-android-${TAG}-${flavor}.apk"
          done
          for apk in mobile/android/app/build/outputs/apk/*/debug/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist-mobile/proxy-gateway-runtime-android-${TAG}-${flavor}-debug.apk"
          done
          ls -lh dist-mobile
          for _ in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist-mobile/*.apk --clobber
              echo "attached $(ls dist-mobile/*.apk | tr '\n' ' ')to $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::30 分钟内没等到 $TAG 的 draft release，跳过附加（APK 仍在本次运行的 artifact 里）"
