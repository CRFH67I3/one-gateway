name: mobile-android

# Android shell for the gateway.
#
# The gateway itself is the repository-root Python code (stdlib only); this job
# only packages it into an APK with Chaquopy's CPython runtime. It therefore
# rebuilds whenever the core, the panel, or the Android shell changes - a core
# change must never ship an APK built from stale Python.
on:
  push:
    branches: [main]
    # 发版 tag 要重新出包：Release 里放的必须是「这一版核心打进 APK」的产物，
    # 不能复用 main 上一次构建留下的 artifact。tag 推送不参与 paths 过滤，
    # 所以即使这个 tag 只动了文档，也会照常构建。
    tags: ["v*"]
    paths:
      - "wb_*.py"
      - "dashboard.html"
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "wb_*.py"
      - "dashboard.html"
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 needs JDK 17; Chaquopy needs a host Python whose minor version
      # matches the embedded one (3.13) to assemble the pip requirements.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Syntax gate (gateway core + bridge)
        run: |
          python -m compileall -q wb_proxy.py wb_accounts.py wb_settings.py \
            mobile/shared mobile/android/app/src/main/python

      # 固定 debug 签名。
      # AGP 在 ~/.android/debug.keystore 缺失时会**现场生成**一对随机密钥：alias
      # （androiddebugkey）和口令（android）都是固定值，密钥本身不是。托管 runner
      # 每次都是全新虚拟机，于是每次构建的证书都不同——跨构建无法覆盖安装
      # （INSTALL_FAILED_UPDATE_INCOMPATIBLE），依赖签名指纹的校验也会失效。
      # 把一份固定 keystore 存进 secret，构建前还原，签名就稳定了。
      - name: Restore fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.WB_ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::未配置 WB_ANDROID_DEBUG_KEYSTORE：本次 debug keystore 由 AGP 随机生成，无法覆盖安装其它构建"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # 口令必须是 AGP 约定的 android，否则要等签名阶段才报错，很难定位。
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "debug keystore 已还原，证书指纹："
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "SHA256:" || true

      - name: Build APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Report artifacts
        run: |
          ls -lh mobile/android/app/build/outputs/apk/*/*.apk
          # The gateway core must be inside the APK, not only in the source tree.
          unzip -l mobile/android/app/build/outputs/apk/release/*.apk \
            | grep -q "assets/core/wb_proxy.py"

      # 把实际签进 APK 的证书打出来：签名是否固定，日志里一眼可查，不用下载对比。
      - name: Report signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -type f -name apksigner | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::找不到 apksigner，跳过证书指纹打印"
            exit 0
          fi
          for apk in mobile/android/app/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" \
              | grep -E "Signer #1 certificate SHA-256 digest" | head -n1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-hub-android
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Release 的创建权在 release.yml：它只建 draft，由维护者补完说明后手动
      # Publish。这里绝不能自己建 release——softprops/action-gh-release 在没有
      # 现存 release 时会建成**已发布**状态，既绕开约定，也会让 release.yml
      # 检测到「不是 draft」而中止整条发布。
      # 所以：等 draft 出现，再往里追加产物。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 便携版打出来的 OpenWrt 包也以 .apk 结尾，重命名避免同名的混淆。
          mkdir -p dist-mobile
          cp mobile/android/app/build/outputs/apk/release/*.apk \
             "dist-mobile/workbuddy-hub-android-${TAG}.apk"
          cp mobile/android/app/build/outputs/apk/debug/*.apk \
             "dist-mobile/workbuddy-hub-android-${TAG}-debug.apk"
          for _ in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist-mobile/*.apk --clobber
              echo "attached $(ls dist-mobile/*.apk | tr '\n' ' ')to $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::30 分钟内没等到 $TAG 的 draft release，跳过附加（APK 仍在本次运行的 artifact 里）"
