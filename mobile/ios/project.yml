# XcodeGen 工程描述：用文本定义 iOS 工程，CI 里 `xcodegen generate` 出 .xcodeproj，
# 避免把几千行的 pbxproj 二进制式文件塞进仓库、也避免合并冲突。
name: WorkBuddyHub

options:
  bundleIdPrefix: com.workbuddy2api
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # 固定工程格式为 Xcode 15.3（objectVersion 56）：默认的 xcode16_0 会写
  # objectVersion 77，Xcode 15 打不开（"future Xcode project file format"）。
  # 我们只用到 iOS 15 时代的能力，没有理由把构建工具链绑死在 Xcode 16 上。
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # preBuildScripts 要复制仓库里的网关核心，脚本沙箱必须关掉。
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.10.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"

targets:
  # 实时活动（Live Activity）的 Widget Extension：锁屏卡片 + 灵动岛。
  # 单独一个 extension target 是 ActivityKit 的硬要求，App 内没法直接画锁屏卡片。
  # 部署版本单独提到 16.1：Live Activity 就是从这个版本开始有的，主 App 仍保持 15。
  WorkBuddyHubWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: WorkBuddyHubWidget
        # 这个 plist 走 INFOPLIST_FILE，不能再当资源复制，否则 "Multiple commands produce Info.plist"。
        excludes:
          - "Info.plist"
      # 与主 App 共享同一份 ActivityAttributes 定义（两边各编译一份，靠类型名配对）。
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: WorkBuddyHubWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy2api.hub.widget
        PRODUCT_NAME: WorkBuddyHubWidget
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  WorkBuddyHub:
    type: application
    platform: iOS
    sources:
      - path: WorkBuddyHub/Sources
      # 实时活动的共享定义（与 Widget Extension 同一个文件）。
      - path: Shared
      # 两个文件夹引用，整个目录原样进包，与 CPython 官方 iOS 指南的布局一一对应：
      #   Resources/app     → 包内 app/    可导入的 Python 代码（PYTHONPATH）
      #   Resources/python  → 包内 python/ CPython 标准库（PYTHONHOME，须保留
      #                                    lib/pythonX.Y 这一层，getpath 只认这个形状）
      - path: WorkBuddyHub/Resources/app
        type: folder
        buildPhase: resources
      - path: WorkBuddyHub/Resources/python
        type: folder
        buildPhase: resources
    dependencies:
      # BeeWare python-app-support 产出的 XCFramework（CI 下载，不入库）。
      - framework: Vendor/Python.xcframework
        embed: true
        codeSign: true
      # appex 必须嵌入主包 PlugIns/，否则锁屏与灵动岛都不会出现卡片。
      - target: WorkBuddyHubWidget
        embed: true
    preBuildScripts:
      - name: Sync gateway core
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/sync-core.sh"
    settings:
      base:
        INFOPLIST_FILE: WorkBuddyHub/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy2api.hub
        PRODUCT_NAME: WorkBuddyHub
        TARGETED_DEVICE_FAMILY: "1,2"
        # CPython 的 C API 通过桥接头暴露，走官方文档给的 `#include <Python/Python.h>`
        # 路径，不依赖 Swift 能否 `import Python`。
        SWIFT_OBJC_BRIDGING_HEADER: WorkBuddyHub/Sources/WorkBuddyHub-Bridging-Header.h
        # 注意：不要再手动加 Python.xcframework 的 FRAMEWORK_SEARCH_PATHS。
        # Xcode 会把切片里的 Python.framework 复制到 $(BUILT_PRODUCTS_DIR) 并自动加进
        # 搜索路径；再指一份 Vendor 下的副本会让 clang 同时看到两个
        # Python.framework/Headers/module.modulemap，报 "redefinition of module 'Python'"。
        #
        # 头文件按官方文档指到 BUILT_PRODUCTS_DIR 里那一份：Python.framework 的
        # module.modulemap 在 Headers/ 下，只有把该目录放进 header search path，
        # clang 才能在 include 时加载模块定义，否则报
        # "module 'Python' ... is not defined in any loaded module map file"。
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)/Python.framework/Headers
        # framework 头里用引号 include 同名头文件，iOS SDK 默认对此告警，关掉。
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: "NO"
